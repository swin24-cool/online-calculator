    if(document.getElementById('btn-submit')) {
        document.getElementById('btn-submit').addEventListener('click', async () => {
            if (!currentStationId) { showToast('⚠️ 請先輸入並載入票所編號！'); return; }
            
            const fileGov = document.getElementById('upload-gov').files[0];
            const fileRef = document.getElementById('upload-ref').files[0];
            
            let hasData = false;
            let errorMessages = [];
            let calcErrors = [];
            let emptyErrors = []; 
            const payloadData = {};
            
            const typeNames = { mayor: '市長', councilor: '區域議員', flatland: '平地原住民', mountain: '山地原住民', village: '里長', referendum: '公投' };
            
            ['mayor', 'councilor', 'flatland', 'mountain', 'village', 'referendum'].forEach(type => {
                const checkEl = document.getElementById(`${type}_check`);
                if (checkEl && !checkEl.classList.contains('locked-empty')) {
                    hasData = true;
                    const electors = Number(document.getElementById(`${type}_electors`).value || 0);
                    const checkVal = Number(checkEl.value || 0);
                    
                    if (electors !== checkVal || checkVal === 0) { calcErrors.push(typeNames[type]); }
                    
                    let typeHasEmpty = false;
                    document.querySelectorAll(`.${type}-cand:not(.locked-empty)`).forEach(input => {
                        if (input.value.trim() === "") typeHasEmpty = true;
                    });
                    ['invalid', 'issued_not_voted', 'remaining'].forEach(statName => {
                        let el = document.getElementById(`${type}_${statName}`);
                        if (el && !el.classList.contains('locked-empty') && el.value.trim() === "") { typeHasEmpty = true; }
                    });

                    if (typeHasEmpty) { emptyErrors.push(typeNames[type]); }
                    
                    const data = {
                        candidates: {},
                        valid: document.getElementById(`${type}_valid`)?.value || "",
                        invalid: document.getElementById(`${type}_invalid`)?.value || "",
                        total: document.getElementById(`${type}_total`)?.value || "",
                        issuedNotVoted: document.getElementById(`${type}_issued_not_voted`)?.value || "",
                        issued: document.getElementById(`${type}_issued`)?.value || "",
                        remaining: document.getElementById(`${type}_remaining`)?.value || "",
                        electors: document.getElementById(`${type}_electors`)?.value || "",
                        check: checkEl.value || ""
                    };
                    document.querySelectorAll(`.${type}-cand`).forEach((input, index) => {
                        data.candidates[index + 1] = input.value;
                    });
                    payloadData[type] = data;
                }
            });

            if (fileGov && fileRef) {
                if (fileGov.name === fileRef.name && fileGov.size === fileRef.size) {
                    errorMessages.push("❌ 公職與公投不能上傳「同一張」報表圖檔！請分別拍攝上傳。");
                }
            }

            if (!fileGov) errorMessages.push("❌ 未上傳【公職報表圖檔】");
            if (!fileRef) errorMessages.push("❌ 未上傳【公投報表圖檔】");
            if (calcErrors.length > 0) errorMessages.push(`❌ 以下選票試算錯誤：\n   👉 ${calcErrors.join('、')}`);
            if (emptyErrors.length > 0) errorMessages.push(`❌ 以下選票有「漏填」欄位 (沒有得票也必須填 0)：\n   👉 ${emptyErrors.join('、')}`);
            if (!hasData) errorMessages.push("❌ 沒有可傳送的票所資料");

            if (errorMessages.length > 0) {
                showCustomAlert("【資料無法傳送】請修正以下問題：\n\n" + errorMessages.join("\n"));
                return;
            }

            const txIdGov = currentStationId + '-G-' + Math.floor(1000 + Math.random() * 9000);
            const txIdRef = currentStationId + '-R-' + Math.floor(1000 + Math.random() * 9000);

            const toBase64 = file => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });

            const submitBtn = document.getElementById('btn-submit');
            submitBtn.textContent = "傳送中(含圖檔)..."; submitBtn.disabled = true;

            (async () => {
                try {
                    const govBase64 = await toBase64(fileGov);
                    const refBase64 = await toBase64(fileRef);
                    const govExt = fileGov.name.split('.').pop();
                    const refExt = fileRef.name.split('.').pop();

                    const payload = { 
                        stationId: currentStationId, 
                        txIdGov: txIdGov,
                        txIdRef: txIdRef, 
                        timestamp: new Date().toLocaleString('zh-TW'), 
                        data: payloadData,
                        imageGov: { base64: govBase64, ext: govExt },
                        imageRef: { base64: refBase64, ext: refExt }
                    };

                    const res = await fetch(GAS_API_URL, { method: 'POST', mode: 'cors', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' } });
                    const data = await res.json();
                    
                    if (data.status === 'success') {
                        if (data.message.includes('⚠️')) showCustomAlert(data.message);
                        else showToast(data.message, 4000);
                        
                        const successText = document.getElementById('success-text');
                        if(successText) {
                            successText.classList.remove('opacity-0');
                            successText.classList.add('opacity-100');
                        }
                        hasSubmittedCurrentDraft = true;
                        saveDraftNow();
                        sendAuditLog('傳送資料(成功)', `公職:${txIdGov} / 公投:${txIdRef}`, currentStationId);
                    } else {
                        showCustomAlert("❌ 傳送失敗：\n" + data.message);
                        sendAuditLog('傳送資料(失敗)', data.message || '後端回傳失敗', currentStationId);
                    }
                } catch (err) {
                    showCustomAlert(`❌ 網路連線失敗或圖檔處理異常：\n${err}`);
                    sendAuditLog('傳送資料(連線異常)', String(err), currentStationId);
                } finally {
                    submitBtn.textContent = "傳送資料(含A3報表圖)"; 
                    submitBtn.disabled = false;
                }
            })();
        });
    }

    if(document.getElementById('btn-lock')) {
        document.getElementById('btn-lock').addEventListener('click', () => {
            const tableWrapper = document.getElementById('table-wrapper');
            tableWrapper.classList.toggle('locked');
            const isLockedNow = tableWrapper.classList.contains('locked');
            if (isLockedNow) { showToast('🔒 表格已鎖定，避免誤觸修改。'); } 
            else { showToast('🔓 表格已解鎖，開放編輯。'); }
            scheduleAutoSave();
            sendAuditLog(isLockedNow ? '鎖定表格' : '解鎖表格', '', currentStationId);
        });
    }

    if(document.getElementById('btn-clear-all')) {
        document.getElementById('btn-clear-all').addEventListener('click', () => {
            const tableWrapper = document.getElementById('table-wrapper');
            if (tableWrapper.classList.contains('locked')) {
                showToast('🔒 表格已鎖定，無法清除資料！請先解鎖。', 3000);
                return;
            }

            const clearedStationId = currentStationId;
            document.querySelectorAll('input.data-cell:not(.locked-empty), input.editable-stat:not(.locked-empty)').forEach(input => { input.value = ""; });
            ['mayor', 'councilor', 'flatland', 'mountain', 'village', 'referendum'].forEach(type => { calculateTotals(type); });
            clearDraftFromLocalStorage();
            showToast('🗑️ 已清除所有輸入資料與本機暫存。');
            sendAuditLog('清除全部', '清除畫面數值與本機暫存', clearedStationId);
            
            const successText = document.getElementById('success-text');
            if(successText) {
                successText.classList.add('opacity-0');
                successText.classList.remove('opacity-100');
            }
            
            clearFileInput('upload-gov', 'file-name-gov', 'clear-file-gov');
            clearFileInput('upload-ref', 'file-name-ref', 'clear-file-ref');
        });
    }

    function getFallbackData() {
        return {
            "1282": { checkValues: { mayor: 1000, councilor: 1000, flatland: 0, mountain: 0, village: 100, referendum: 1000 }, villageCandidates: ["李珮忻", "徐庭崇"] },
            "1285": { checkValues: { mayor: 1200, councilor: 1200, flatland: 10, mountain: 20, village: 100, referendum: 1200 }, villageCandidates: ["吳美玫"] }
        };
    }

    const toast = document.getElementById('toast');
    function showToast(msg, duration = 3000) { toast.textContent = msg; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), duration); }
    
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('✅ ServiceWorker 註冊成功'))
                .catch(err => console.log('❌ ServiceWorker 註冊失敗: ', err));
        });
    }

</script>
</body>
</html>
