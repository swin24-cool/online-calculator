<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>115年選舉_萬華區計票中心</title>

    <!-- 💡 PWA 設定 -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <link rel="apple-touch-icon" href="./PWA_icon(192x192).png">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html {
            overscroll-behavior-y: auto;
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #eef2f7;
            -webkit-text-size-adjust: 100%;
        }

        body {
            overscroll-behavior-y: auto;
            width: 100%;
            min-height: 100dvh;
            margin: 0;
            padding: 0;
            background-color: #eef2f7;
            font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang TC', '微軟正黑體', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* 手機直向：精準鎖定 100dvh 一頁滿版（不多不少剛剛好撐滿螢幕） */
        .app-shell {
            width: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 若手機橫放或螢幕極矮 (<580px)，自動放寬高度並恢復順暢手指上下滑動 */
        @media (max-height: 579px) {
            .app-shell {
                height: auto;
                min-height: 100dvh;
                overflow: visible;
            }
        }

        /* 電腦、平板或 Canvas 預覽視窗 (>=600px 且高度足夠) 維持精緻居中手機卡片比例；實際手機 (<600px) 維持 100% 滿版 */
        @media (min-width: 600px) and (min-height: 580px) {
            body {
                justify-content: center;
                padding: 12px;
            }
            .app-shell {
                max-width: 500px;
                height: min(840px, calc(100dvh - 24px));
                border-radius: 1rem;
                box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
                border: 1px solid #e2e8f0;
            }
        }

        /* 頂部與底部安全區域留白（支援全螢幕瀏海／手勢條手機） */
        .safe-top-header {
            padding-top: max(0.65rem, env(safe-area-inset-top));
            padding-bottom: 0.65rem;
        }
        .safe-bottom-footer {
            padding-bottom: max(0.45rem, env(safe-area-inset-bottom));
        }

        /* 依螢幕高度平滑縮放的主內容間距與圖示尺寸 */
        .portal-main {
            padding: clamp(8px, 1.4dvh, 16px) 12px;
            gap: clamp(8px, 1.3dvh, 14px);
        }
        .tool-svg-wrap {
            width: clamp(40px, 6.4dvh, 64px);
            height: clamp(40px, 6.4dvh, 64px);
        }
        .schedule-grid {
            display: grid;
            grid-template-rows: repeat(5, minmax(0, 1fr));
            gap: clamp(5px, 0.9dvh, 10px);
        }

        /* 呼吸綠燈動畫 */
        @keyframes livePulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.65); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
        .live-dot {
            width: 14px;
            height: 14px;
            border-radius: 9999px;
            background-color: #22c55e;
            border: 2px solid #ffffff;
            box-shadow: 0 0 0 2px #16a34a;
            animation: livePulse 1.8s infinite;
            flex-shrink: 0;
        }

        /* 黃底動態填報彈窗樣式（還原設計稿） */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .yellow-report-card {
            background: #fef08a;
            border: 3px solid #eab308;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            position: relative;
            animation: popIn 0.18s ease-out;
        }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .report-input {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 20px;
            font-weight: 800;
            text-align: center;
            color: #0f172a;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .report-input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
        }

        /* 底部三張圖示卡片互動感 */
        .tool-card {
            transition: transform 0.12s ease, box-shadow 0.15s ease;
        }
        .tool-card:active {
            transform: scale(0.96);
        }

        /* 💡 站內滿版純網頁報表檢視框（免選帳號、支援 25%~250% 自由縮放與雙指捏合、關閉即釋放記憶體） */
        .sheet-viewer-overlay {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100dvh;
            background: #ffffff;
            z-index: 10002;
            display: none;
            flex-direction: column;
        }
        .sheet-viewer-overlay.open {
            display: flex;
        }
        .sheet-viewer-frame-wrap {
            flex: 1;
            min-height: 0;
            width: 100%;
            position: relative;
            overflow: hidden;
            background: #ffffff;
        }
        .sheet-viewer-body {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            background: #ffffff;
        }
        .sheet-pinch-shield {
            position: absolute;
            inset: 0;
            z-index: 20;
            display: none;
            touch-action: none;
            background: rgba(15, 23, 42, 0.08);
            align-items: flex-start;
            justify-content: center;
            padding-top: 14px;
        }
        .sheet-pinch-shield.active {
            display: flex;
        }
        .zoom-range {
            accent-color: #2563eb;
            height: 6px;
        }

        /* Toast 提示 */
        .toast-msg {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(15, 23, 42, 0.95);
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 9999px;
            font-size: 14px;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s, transform 0.25s;
            z-index: 10005;
            max-width: 90vw;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }
        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body class="min-h-[100dvh] w-full flex flex-col items-center">

    <!-- 主容器：手機自動精準撐滿 100dvh 一頁畫面；電腦大螢幕自動置中呈現卡片感 -->
    <div class="app-shell bg-white">

        <!-- 1. 頂部標題與動態台灣時間（俐落 2 行排版，把更多空間留給按鈕與清單） -->
        <header class="safe-top-header bg-gradient-to-r from-slate-800 to-blue-900 text-white px-4 text-center relative shrink-0">
            <h1 class="text-[clamp(1.15rem,4.8vw,1.55rem)] font-black tracking-wide leading-tight">
                115年選舉_萬華區計票中心
            </h1>
            <div class="mt-1.5 flex items-center justify-center gap-2 flex-wrap">
                <div class="flex items-center gap-1.5 text-blue-100 font-mono text-[clamp(0.9rem,3.6vw,1.1rem)] font-bold">
                    <span id="live-date">----/--/--</span>
                    <span id="live-clock" class="text-yellow-300 tracking-wider">--:--:--</span>
                </div>
                <button type="button" onclick="fetchPortalConfig(true)" id="btn-refresh"
                    class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-white/15 hover:bg-white/25 active:scale-95 text-xs font-bold text-white border border-white/30 transition">
                    🔄 同步時段
                </button>
            </div>
        </header>

        <!-- 主內容區（flex-1 min-h-0 精準分配螢幕剩餘高度，確保底部 3 顆按鈕 100% 完整露出） -->
        <main class="portal-main flex-1 min-h-0 flex flex-col">

            <!-- 2. 核心大按鈕（自動偵測當下開放中的回報項目） -->
            <section id="hero-action-section" class="shrink-0">
                <div class="w-full rounded-2xl border-2 border-slate-200 bg-slate-50 py-3.5 px-4 text-center text-slate-500 font-bold text-sm">
                    ⏳ 正在同步雲端時段設定...
                </div>
            </section>

            <!-- 3. 5 大定時回報時段清單（自動 5 等分平分中間剩餘高度，不多不少剛剛好） -->
            <section class="flex-1 min-h-0 bg-slate-50 rounded-2xl border border-slate-200 p-2.5 sm:p-3 flex flex-col">
                <div class="flex items-center justify-between mb-2 pb-1.5 border-b border-slate-200 shrink-0">
                    <h2 class="text-sm sm:text-base font-black text-slate-700 flex items-center gap-1.5">
                        📋 回報時段狀態總覽
                    </h2>
                    <span id="open-count-badge" class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-slate-200 text-slate-600">
                        讀取中
                    </span>
                </div>
                <div id="schedule-list" class="schedule-grid flex-1 min-h-0">
                    <!-- 動態渲染 5 項時段 -->
                </div>
            </section>

            <!-- 4. 底部 3 大功能文字圖示卡片（計算機 / 騎機車 / 圓形百分比） -->
            <section class="shrink-0">
                <div class="grid grid-cols-3 gap-2.5">

                    <!-- 左：報告表試算 (站內進入 calculator.html) -->
                    <a href="./calculator.html"
                       class="tool-card flex flex-col items-center justify-between rounded-2xl bg-sky-100 hover:bg-sky-200 border-2 border-sky-300 py-2 px-1.5 sm:py-2.5 sm:px-2 shadow-sm text-center">
                        <span class="text-[13px] sm:text-sm font-black text-slate-800 leading-tight">報告表試算</span>
                        <div class="tool-svg-wrap my-1 flex items-center justify-center">
                            <!-- 計算機＋表格 SVG 圖示 -->
                            <svg viewBox="0 0 80 80" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect x="6" y="34" width="68" height="36" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
                                <line x1="6" y1="46" x2="74" y2="46" stroke="#cbd5e1" stroke-width="1.5"/>
                                <line x1="6" y1="58" x2="74" y2="58" stroke="#cbd5e1" stroke-width="1.5"/>
                                <line x1="24" y1="34" x2="24" y2="70" stroke="#cbd5e1" stroke-width="1.5"/>
                                <line x1="56" y1="34" x2="56" y2="70" stroke="#cbd5e1" stroke-width="1.5"/>
                                <g transform="rotate(-14 40 38)">
                                    <rect x="20" y="10" width="38" height="52" rx="6" fill="#334155" stroke="#0f172a" stroke-width="2.5"/>
                                    <rect x="25" y="15" width="28" height="12" rx="2.5" fill="#bae6fd"/>
                                    <circle cx="30" cy="35" r="3.5" fill="#fb923c"/>
                                    <circle cx="39" cy="35" r="3.5" fill="#ffffff"/>
                                    <circle cx="48" cy="35" r="3.5" fill="#ffffff"/>
                                    <circle cx="30" cy="45" r="3.5" fill="#ffffff"/>
                                    <circle cx="39" cy="45" r="3.5" fill="#ffffff"/>
                                    <circle cx="48" cy="45" r="3.5" fill="#38bdf8"/>
                                    <rect x="27" y="52" width="14" height="5" rx="2" fill="#ffffff"/>
                                    <rect x="44" y="52" width="8" height="5" rx="2" fill="#22c55e"/>
                                </g>
                            </svg>
                        </div>
                        <span class="text-[11px] font-bold text-sky-800 bg-white/85 px-2 py-0.5 rounded-full whitespace-nowrap">開啟試算</span>
                    </a>

                    <!-- 中：速報員出發 (依時段開啟黃底彈窗) -->
                    <button type="button" id="btn-courier-card" onclick="handleCourierClick()"
                       class="tool-card flex flex-col items-center justify-between rounded-2xl bg-amber-100 hover:bg-amber-200 border-2 border-amber-300 py-2 px-1.5 sm:py-2.5 sm:px-2 shadow-sm text-center relative">
                        <span class="text-[13px] sm:text-sm font-black text-slate-800 leading-tight">速報員出發</span>
                        <div class="tool-svg-wrap my-1 flex items-center justify-center">
                            <!-- 騎機車人物 SVG 圖示 -->
                            <svg viewBox="0 0 80 80" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <!-- 速度風線 -->
                                <line x1="8" y1="28" x2="22" y2="28" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
                                <line x1="4" y1="36" x2="18" y2="36" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
                                <!-- 騎士頭盔與身體 -->
                                <circle cx="44" cy="20" r="8" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2.5"/>
                                <path d="M47 17 C51 17 52 21 51 23 L45 23 Z" fill="#fef08a"/>
                                <path d="M41 29 L34 45 L46 47 L49 36 L58 35" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                                <!-- 機車車身 -->
                                <path d="M22 50 C25 43 37 43 44 48 L56 48 L60 33 L54 31" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M24 52 C28 46 39 46 46 53 L58 53 C61 53 64 56 64 59 L22 59 Z" fill="#3b82f6" stroke="#1e3a8a" stroke-width="2"/>
                                <!-- 前後車輪 -->
                                <circle cx="26" cy="60" r="8" fill="#334155" stroke="#0f172a" stroke-width="2.5"/>
                                <circle cx="26" cy="60" r="3" fill="#e2e8f0"/>
                                <circle cx="60" cy="60" r="8" fill="#334155" stroke="#0f172a" stroke-width="2.5"/>
                                <circle cx="60" cy="60" r="3" fill="#e2e8f0"/>
                            </svg>
                        </div>
                        <span id="courier-status-pill" class="text-[11px] font-bold text-amber-900 bg-white/85 px-2 py-0.5 rounded-full whitespace-nowrap">讀取中</span>
                    </button>

                    <!-- 右：一二聯進度 (💡 改為站內滿版純網頁 iframe 檢視，100% 繞過 Android 選取 Google 帳號攔截) -->
                    <button type="button" onclick="openSheetViewer('progress')"
                       class="tool-card flex flex-col items-center justify-between rounded-2xl bg-emerald-100 hover:bg-emerald-200 border-2 border-emerald-300 py-2 px-1.5 sm:py-2.5 sm:px-2 shadow-sm text-center">
                        <span class="text-[13px] sm:text-sm font-black text-slate-800 leading-tight">一二聯進度</span>
                        <div class="tool-svg-wrap my-1 flex items-center justify-center">
                            <!-- 圓形百分比儀表 SVG 圖示 -->
                            <svg viewBox="0 0 80 80" class="w-full h-full" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <!-- 外圓環 -->
                                <circle cx="40" cy="40" r="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="6"/>
                                <!-- 進度扇形與圓弧 (75%) -->
                                <circle cx="40" cy="40" r="28" fill="none" stroke="#16a34a" stroke-width="7"
                                        stroke-dasharray="132 176" stroke-linecap="round" transform="rotate(-90 40 40)"/>
                                <!-- 中心百分比文字 -->
                                <text x="40" y="45" text-anchor="middle" font-size="18" font-weight="900" fill="#1e3a8a" font-family="sans-serif">%</text>
                                <!-- 右下小綠點裝飾 -->
                                <circle cx="62" cy="60" r="7" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
                                <path d="M59 60 L61.2 62.2 L65.5 57.8" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                        <span class="text-[11px] font-bold text-emerald-800 bg-white/85 px-2 py-0.5 rounded-full whitespace-nowrap">即時檢視</span>
                    </button>

                </div>
            </section>

        </main>

        <footer class="safe-bottom-footer bg-slate-100 border-t border-slate-200 px-3 pt-1.5 text-center text-[11px] text-slate-500 font-bold shrink-0">
            萬華區選務中心行動入口 PWA｜請於開放時段內完成各項回報
        </footer>
    </div>

    <!-- ================= 黃底動態填報彈窗 ================= -->
    <div id="report-modal-overlay" class="modal-overlay" onclick="if(event.target === this) closeReportModal()">
        <div class="yellow-report-card p-6">
            <!-- 右上角關閉按鈕 -->
            <button type="button" onclick="closeReportModal()"
                class="absolute top-3 right-3 w-9 h-9 rounded-full bg-amber-200/80 hover:bg-red-500 hover:text-white text-slate-700 font-black text-lg flex items-center justify-center transition">
                ✖
            </button>

            <!-- 彈窗標題 -->
            <h3 id="modal-title" class="text-xl sm:text-2xl font-black text-slate-900 text-center pr-6 mb-5">
                填報視窗
            </h3>

            <!-- 動態表單欄位 -->
            <form id="portal-report-form" onsubmit="submitPortalReport(event)" class="flex flex-col gap-4">
                <!-- 票所編號（固定皆有，無首頁記憶） -->
                <div class="flex items-center justify-center gap-2">
                    <label for="modal-station-id" class="font-bold text-slate-800 text-base whitespace-nowrap w-32 text-right">
                        投開票所編號：
                    </label>
                    <input type="number" id="modal-station-id" inputmode="numeric" min="1282" max="1419" required
                        placeholder="1282~1419" class="report-input w-36">
                </div>

                <!-- 投票率專用欄位（僅 turnout_1 ~ turnout_4 顯示） -->
                <div id="turnout-fields" class="hidden flex-col gap-3">
                    <div class="flex items-center justify-center gap-2">
                        <label for="modal-gov-count" class="font-bold text-slate-800 text-base whitespace-nowrap w-32 text-right">
                            投票人數(公職)：
                        </label>
                        <input type="number" id="modal-gov-count" inputmode="numeric" min="1" step="1"
                            placeholder="正整數" class="report-input w-28">
                        <span class="font-bold text-slate-700 text-sm">人次</span>
                    </div>
                    <div class="flex items-center justify-center gap-2">
                        <label for="modal-ref-count" class="font-bold text-slate-800 text-base whitespace-nowrap w-32 text-right">
                            投票人數(公投)：
                        </label>
                        <input type="number" id="modal-ref-count" inputmode="numeric" min="1" step="1"
                            placeholder="正整數" class="report-input w-28">
                        <span class="font-bold text-slate-700 text-sm">人次</span>
                    </div>
                    <p class="text-xs text-amber-900 font-bold text-center bg-amber-200/70 rounded-lg py-1.5 px-2">
                        💡 請填入大於 0 的正整數；開放時段內可重複送出覆蓋舊資料
                    </p>
                </div>

                <!-- 即時狀態回饋區塊 -->
                <div id="modal-feedback" class="hidden rounded-lg px-3 py-2 text-sm font-bold text-center"></div>

                <!-- 按鈕列（依類型動態調整） -->
                <div id="modal-actions" class="mt-2 flex items-center justify-center gap-3">
                    <button type="submit" id="btn-modal-submit"
                        class="px-6 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-black text-base shadow-md transition">
                        送出回報
                    </button>
                    <!-- 💡 上方 5 次回報專用：改以站內滿版純網頁檢視 gid=565701336，同樣免選 Google 帳號且支援縮放 -->
                    <button type="button" id="btn-modal-result" onclick="openSheetViewer('result')"
                        class="px-5 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 active:scale-95 text-white font-black text-base shadow-md transition inline-flex items-center gap-1">
                        查看結果 &gt;
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ================= 站內滿版純網頁報表檢視視窗（免選帳號、支援自由縮放、關閉即釋放記憶體） ================= -->
    <div id="sheet-viewer-overlay" class="sheet-viewer-overlay">
        <div class="safe-top-header bg-gradient-to-r from-slate-800 to-blue-900 text-white px-3 flex items-center justify-between gap-2 shadow-md shrink-0">
            <h3 id="sheet-viewer-title" class="text-base sm:text-lg font-black truncate">📊 即時檢視</h3>
            <div class="flex items-center gap-2 shrink-0">
                <button type="button" onclick="reloadSheetViewer()"
                    class="px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25 active:scale-95 text-xs sm:text-sm font-bold text-white border border-white/25 transition">
                    🔄 重整
                </button>
                <button type="button" onclick="closeSheetViewer()"
                    class="px-3.5 py-1.5 rounded-lg bg-red-500 hover:bg-red-600 active:scale-95 text-xs sm:text-sm font-black text-white shadow-sm transition">
                    ✖ 關閉
                </button>
            </div>
        </div>

        <!-- 自由縮放工具列（支援單手滑桿、微調鈕、預設比例與雙指捏合模式） -->
        <div class="bg-slate-100 border-b border-slate-300 px-2.5 py-2 flex items-center gap-1.5 sm:gap-2 shrink-0 select-none">
            <button type="button" onclick="stepSheetZoom(-10)" aria-label="縮小"
                class="w-9 h-8 rounded-lg bg-white hover:bg-slate-200 active:scale-95 border border-slate-300 font-black text-slate-800 text-base flex items-center justify-center shrink-0 shadow-sm">
                －
            </button>
            <input type="range" id="sheet-zoom-slider" min="25" max="250" step="5" value="65"
                oninput="setSheetZoom(this.value)" class="zoom-range flex-1 min-w-0 cursor-pointer">
            <button type="button" onclick="stepSheetZoom(10)" aria-label="放大"
                class="w-9 h-8 rounded-lg bg-white hover:bg-slate-200 active:scale-95 border border-slate-300 font-black text-slate-800 text-base flex items-center justify-center shrink-0 shadow-sm">
                ＋
            </button>
            <button type="button" id="btn-zoom-preset" onclick="cycleSheetZoomPreset()" title="點擊快速切換常用比例"
                class="min-w-[54px] h-8 px-2 rounded-lg bg-blue-50 hover:bg-blue-100 active:scale-95 border border-blue-300 text-blue-800 font-mono font-black text-xs shrink-0 transition">
                65%
            </button>
            <button type="button" id="btn-pinch-mode" onclick="togglePinchMode()"
                class="h-8 px-2.5 rounded-lg bg-white hover:bg-amber-50 active:scale-95 border border-slate-300 text-slate-700 font-bold text-xs shrink-0 transition whitespace-nowrap">
                🤏 雙指
            </button>
        </div>

        <div class="sheet-viewer-frame-wrap">
            <div id="sheet-viewer-loading" class="absolute inset-0 flex flex-col items-center justify-center gap-2.5 bg-slate-50 text-slate-600 font-bold text-sm z-10">
                <div class="w-9 h-9 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                <span>正在直接開啟最新公開報表...</span>
            </div>
            <!-- 雙指捏合感應遮罩（平時關閉不影響單指滑動看表；啟動後兩指捏合放開即自動結束） -->
            <div id="sheet-pinch-shield" class="sheet-pinch-shield">
                <div class="px-4 py-2 rounded-full bg-slate-900/90 text-white text-xs font-bold shadow-lg border border-white/20">
                    🤏 請用雙指捏合自由縮放（放開自動恢復滑動，或點一下退出）
                </div>
            </div>
            <div id="sheet-viewer-body" class="sheet-viewer-body"></div>
        </div>
    </div>

    <div id="toast" class="toast-msg"></div>

    <script>
        // ⚠️ 與試算器共用同一支 GAS API 網址
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbw7-9Axst2b44keFWFllxzuLWGJPuWoVOijT1-C79K-6AkqPqEwQ6iL02zzjqlalNwhuA/exec';
        // 💡 上方 5 次回報彈窗專用結果頁（發布到網路 /pubhtml，gid=565701336）
        const RESULT_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1z0rjJ1kMWtbdkGvcMUlhCnPLFxTnUOc-R5aQX8ZIX8Y/htmlview?gid=565701336#gid=565701336';
        // 💡 右下角「一二聯進度」專用結果頁（發布到網路 /pubhtml，gid=1982241340）
        const PROGRESS_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1z0rjJ1kMWtbdkGvcMUlhCnPLFxTnUOc-R5aQX8ZIX8Y/htmlview?gid=1982241340#gid=1982241340';

        // 預設離線備援時段（首次連上雲端後將以 Google Sheet「入口設定」完全覆蓋）
        let portalSchedules = [
            { key: 'setup',     label: '11/27 場佈回報',     modalTitle: '11/27 場佈完成回報',      startTimeStr: '2026/11/27 12:00', endTimeStr: '2026/11/27 18:00', startMs: Date.parse('2026-11-27T12:00:00+08:00'), endMs: Date.parse('2026-11-27T18:00:00+08:00') },
            { key: 'turnout_1', label: '09:30 投票率回報-1', modalTitle: '投票數回報(09:30)-1',     startTimeStr: '2026/11/28 09:00', endTimeStr: '2026/11/28 10:00', startMs: Date.parse('2026-11-28T09:00:00+08:00'), endMs: Date.parse('2026-11-28T10:00:00+08:00') },
            { key: 'turnout_2', label: '11:30 投票率回報-2', modalTitle: '投票數回報(11:30)-2',     startTimeStr: '2026/11/28 11:00', endTimeStr: '2026/11/28 12:00', startMs: Date.parse('2026-11-28T11:00:00+08:00'), endMs: Date.parse('2026-11-28T12:00:00+08:00') },
            { key: 'turnout_3', label: '13:30 投票率回報-3', modalTitle: '投票數回報(13:30)-3',     startTimeStr: '2026/11/28 13:00', endTimeStr: '2026/11/28 14:00', startMs: Date.parse('2026-11-28T13:00:00+08:00'), endMs: Date.parse('2026-11-28T14:00:00+08:00') },
            { key: 'turnout_4', label: '15:30 投票率回報-4', modalTitle: '投票數回報(15:30)-4',     startTimeStr: '2026/11/28 15:00', endTimeStr: '2026/11/28 16:00', startMs: Date.parse('2026-11-28T15:00:00+08:00'), endMs: Date.parse('2026-11-28T16:00:00+08:00') },
            { key: 'courier',   label: '速報員回報',         modalTitle: '速報員準備出發_回區公所', startTimeStr: '2026/11/28 16:00', endTimeStr: '2026/11/28 22:00', startMs: Date.parse('2026-11-28T16:00:00+08:00'), endMs: Date.parse('2026-11-28T22:00:00+08:00') }
        ];

        const MAIN_LIST_KEYS = ['setup', 'turnout_1', 'turnout_2', 'turnout_3', 'turnout_4'];
        let serverTimeOffsetMs = 0; // 伺服器時間 - 本機時間
        let activeModalItem = null;
        let lastRenderMinuteKey = '';
        let currentViewerBaseUrl = '';
        let viewerFallbackTimer = null;

        // 報表檢視器縮放狀態
        const STORAGE_SHEET_ZOOM_KEY = 'portal_sheet_zoom_pct_v1';
        const ZOOM_PRESETS = [50, 75, 100, 140];
        let currentSheetZoomPct = 65;
        let activeSheetIframe = null;
        let isPinchMode = false;
        let pinchStartDist = 0;
        let pinchStartZoom = 65;
        let didPinchMove = false;

        function getSyncedNowMs() {
            return Date.now() + serverTimeOffsetMs;
        }

        function formatTaipeiParts(ms) {
            const d = new Date(ms);
            const parts = new Intl.DateTimeFormat('zh-TW', {
                timeZone: 'Asia/Taipei',
                year: 'numeric', month: '2-digit', day: '2-digit',
                hour: '2-digit', minute: '2-digit', second: '2-digit',
                hour12: false
            }).formatToParts(d);
            const map = {};
            parts.forEach(p => { map[p.type] = p.value; });
            return {
                dateStr: `${map.year}/${map.month}/${map.day}`,
                timeStr: `${map.hour}:${map.minute}:${map.second}`,
                minuteKey: `${map.year}${map.month}${map.day}${map.hour}${map.minute}`
            };
        }

        function shortWindowText(str) {
            if (!str) return '';
            return str.replace(/^\d{4}\//, '');
        }

        function getItemState(item, nowMs) {
            if (!item || !item.startMs || !item.endMs) return 'locked';
            if (nowMs < item.startMs) return 'upcoming';
            if (nowMs > item.endMs) return 'closed';
            return 'open';
        }

        function findScheduleByKey(key) {
            return portalSchedules.find(s => s.key === key) || null;
        }

        // === 1. 從 GAS 抓取「入口設定」與伺服器校時 ===
        async function fetchPortalConfig(manual = false) {
            const btn = document.getElementById('btn-refresh');
            if (btn) {
                btn.disabled = true;
                btn.textContent = '⏳ 同步中...';
            }
            try {
                const res = await fetch(`${GAS_API_URL}?action=getPortalConfig&_t=${Date.now()}`);
                const json = await res.json();
                if (json.status === 'success' && Array.isArray(json.schedules) && json.schedules.length > 0) {
                    portalSchedules = json.schedules;
                    if (json.serverTimeMs) {
                        serverTimeOffsetMs = json.serverTimeMs - Date.now();
                    }
                    if (manual) showToast('✅ 已同步最新「入口設定」時段！');
                } else {
                    throw new Error(json.message || '無法解析時段設定');
                }
            } catch (err) {
                console.warn('讀取入口設定失敗，暫用預設值:', err);
                if (manual) showToast('⚠️ 無法連線雲端，暫時顯示目前設定');
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.textContent = '🔄 同步時段';
                }
                renderAllUI();
            }
        }

        // === 2. 渲染首頁所有區塊（大按鈕 + 5 項清單 + 速報員狀態） ===
        function renderAllUI() {
            const nowMs = getSyncedNowMs();
            renderHeroButton(nowMs);
            renderScheduleList(nowMs);
            renderCourierCard(nowMs);
        }

        function renderHeroButton(nowMs) {
            const container = document.getElementById('hero-action-section');
            const mainItems = MAIN_LIST_KEYS.map(k => findScheduleByKey(k)).filter(Boolean);
            const openItems = mainItems.filter(item => getItemState(item, nowMs) === 'open');

            if (openItems.length > 0) {
                const active = openItems[0];
                const idx = MAIN_LIST_KEYS.indexOf(active.key);
                const prefixTag = active.key === 'setup'
                    ? '【場佈階段】'
                    : `【第 ${idx} 次】`;

                container.innerHTML = `
                    <button type="button" onclick="openReportModal('${active.key}')"
                        class="w-full text-left rounded-2xl border-2 border-emerald-500 bg-gradient-to-br from-emerald-50 via-white to-green-50 px-3.5 py-3 shadow-md hover:shadow-lg active:scale-[0.98] transition cursor-pointer">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="live-dot"></span>
                            <span class="text-sm font-black text-emerald-700 tracking-wide">目前開放回報中</span>
                            <span class="ml-auto text-xs font-mono font-bold text-emerald-800 bg-emerald-100 px-2 py-0.5 rounded-full">
                                截止 ${shortWindowText(active.endTimeStr)}
                            </span>
                        </div>
                        <div class="text-lg sm:text-xl font-black text-slate-900 pl-0.5 leading-snug">
                            ${prefixTag}${active.label}
                        </div>
                        <div class="mt-2 w-full py-2 rounded-xl bg-emerald-600 text-white font-black text-center text-base shadow-sm flex items-center justify-center gap-1.5">
                            <span>👉</span>
                            <span>點此開始填報</span>
                        </div>
                    </button>
                `;
                return;
            }

            const upcomingItems = mainItems
                .filter(item => getItemState(item, nowMs) === 'upcoming')
                .sort((a, b) => a.startMs - b.startMs);

            if (upcomingItems.length > 0) {
                const next = upcomingItems[0];
                container.innerHTML = `
                    <div class="w-full rounded-2xl border-2 border-slate-300 bg-slate-100 px-3.5 py-3 text-center">
                        <div class="flex items-center justify-center gap-1.5 text-slate-700 font-black text-base">
                            <span>🔒</span>
                            <span>目前非定時回報開放時段</span>
                        </div>
                        <div class="mt-1 text-sm font-bold text-slate-700">
                            下一階段：<span class="text-blue-700">${next.label}</span>
                        </div>
                        <div class="mt-1.5 inline-block text-xs font-mono font-bold text-slate-600 bg-white border border-slate-300 px-3 py-0.5 rounded-full">
                            將於 ${shortWindowText(next.startTimeStr)} 開放填報
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="w-full rounded-2xl border-2 border-slate-300 bg-slate-100 px-3.5 py-3 text-center">
                        <div class="flex items-center justify-center gap-1.5 text-slate-700 font-black text-base">
                            <span>⏹️</span>
                            <span>定時回報時段已全數結束</span>
                        </div>
                        <div class="mt-1 text-xs font-bold text-slate-500">
                            請使用下方「報告表試算」或「速報員出發」功能
                        </div>
                    </div>
                `;
            }
        }

        function renderScheduleList(nowMs) {
            const listEl = document.getElementById('schedule-list');
            const badgeEl = document.getElementById('open-count-badge');
            const mainItems = MAIN_LIST_KEYS.map(k => findScheduleByKey(k)).filter(Boolean);

            let openCount = 0;
            let html = '';

            mainItems.forEach(item => {
                const state = getItemState(item, nowMs);
                if (state === 'open') openCount++;

                if (state === 'open') {
                    html += `
                        <button type="button" onclick="openReportModal('${item.key}')"
                            class="w-full h-full min-h-[42px] flex items-center gap-2.5 px-3 py-1 rounded-xl bg-emerald-50 hover:bg-emerald-100 border-2 border-emerald-400 text-left transition active:scale-[0.98]">
                            <span class="live-dot"></span>
                            <div class="flex-1 min-w-0 leading-tight">
                                <div class="font-black text-slate-900 text-sm sm:text-base truncate">${item.label}</div>
                                <div class="text-[11px] font-mono font-bold text-emerald-700 truncate">
                                    開放中（${shortWindowText(item.startTimeStr)} ～ ${shortWindowText(item.endTimeStr)}）
                                </div>
                            </div>
                            <span class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-xs font-black whitespace-nowrap">填報 ▸</span>
                        </button>
                    `;
                } else if (state === 'upcoming') {
                    html += `
                        <button type="button" onclick="showToast('🔒【${item.label}】尚未開放，將於 ${shortWindowText(item.startTimeStr)} 開放填報！')"
                            class="w-full h-full min-h-[42px] flex items-center gap-2.5 px-3 py-1 rounded-xl bg-white border border-slate-200 text-left opacity-85 hover:opacity-100 transition">
                            <span class="text-base sm:text-lg leading-none">🔒</span>
                            <div class="flex-1 min-w-0 leading-tight">
                                <div class="font-bold text-slate-800 text-sm sm:text-base truncate">${item.label}</div>
                                <div class="text-[11px] font-mono text-slate-500 truncate">
                                    ${shortWindowText(item.startTimeStr)} 開放
                                </div>
                            </div>
                            <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-500 text-[11px] font-bold whitespace-nowrap">未開放</span>
                        </button>
                    `;
                } else {
                    html += `
                        <button type="button" onclick="showToast('⏹️【${item.label}】已於 ${shortWindowText(item.endTimeStr)} 截止填報！')"
                            class="w-full h-full min-h-[42px] flex items-center gap-2.5 px-3 py-1 rounded-xl bg-slate-100 border border-slate-200 text-left opacity-65">
                            <span class="text-base leading-none">⏹️</span>
                            <div class="flex-1 min-w-0 leading-tight">
                                <div class="font-bold text-slate-500 text-sm sm:text-base line-through truncate">${item.label}</div>
                                <div class="text-[11px] font-mono text-slate-400 truncate">
                                    已於 ${shortWindowText(item.endTimeStr)} 截止
                                </div>
                            </div>
                            <span class="px-2 py-0.5 rounded bg-slate-200 text-slate-500 text-[11px] font-bold whitespace-nowrap">已截止</span>
                        </button>
                    `;
                }
            });

            listEl.innerHTML = html;
            if (openCount > 0) {
                badgeEl.textContent = `${openCount} 項開放中`;
                badgeEl.className = 'text-xs font-black px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-300';
            } else {
                badgeEl.textContent = '目前皆未開放';
                badgeEl.className = 'text-xs font-bold px-2.5 py-0.5 rounded-full bg-slate-200 text-slate-600';
            }
        }

        function renderCourierCard(nowMs) {
            const courier = findScheduleByKey('courier');
            const cardBtn = document.getElementById('btn-courier-card');
            const pill = document.getElementById('courier-status-pill');
            if (!courier || !cardBtn || !pill) return;

            const state = getItemState(courier, nowMs);
            if (state === 'open') {
                cardBtn.classList.remove('opacity-65', 'grayscale-[40%]');
                pill.textContent = '🟢 開放回報';
                pill.className = 'text-[11px] font-black text-emerald-800 bg-emerald-100 border border-emerald-300 px-2 py-0.5 rounded-full whitespace-nowrap';
            } else if (state === 'upcoming') {
                cardBtn.classList.add('opacity-65', 'grayscale-[40%]');
                pill.textContent = '🔒 尚未開放';
                pill.className = 'text-[11px] font-bold text-slate-600 bg-white/85 px-2 py-0.5 rounded-full whitespace-nowrap';
            } else {
                cardBtn.classList.add('opacity-65', 'grayscale-[40%]');
                pill.textContent = '⏹️ 已截止';
                pill.className = 'text-[11px] font-bold text-slate-500 bg-white/85 px-2 py-0.5 rounded-full whitespace-nowrap';
            }
        }

        function handleCourierClick() {
            const courier = findScheduleByKey('courier');
            if (!courier) return;
            const state = getItemState(courier, getSyncedNowMs());
            if (state === 'open') {
                openReportModal('courier');
            } else if (state === 'upcoming') {
                showToast(`🔒【速報員出發】尚未開放，開放時間：${shortWindowText(courier.startTimeStr)}`);
            } else {
                showToast(`⏹️【速報員出發】已於 ${shortWindowText(courier.endTimeStr)} 截止！`);
            }
        }

        // === 3. 黃底動態填報彈窗控制 ===
        function openReportModal(itemKey) {
            const item = findScheduleByKey(itemKey);
            if (!item) return;

            const state = getItemState(item, getSyncedNowMs());
            if (state !== 'open') {
                showToast(state === 'upcoming'
                    ? `🔒 尚未開放（開放時間：${shortWindowText(item.startTimeStr)}）`
                    : `⏹️ 已超過截止時間（截止時間：${shortWindowText(item.endTimeStr)}）`);
                renderAllUI();
                return;
            }

            activeModalItem = item;
            document.getElementById('modal-title').textContent = item.modalTitle || item.label;

            const stationInput = document.getElementById('modal-station-id');
            const govInput = document.getElementById('modal-gov-count');
            const refInput = document.getElementById('modal-ref-count');
            const turnoutBox = document.getElementById('turnout-fields');
            const submitBtn = document.getElementById('btn-modal-submit');
            const resultBtn = document.getElementById('btn-modal-result');
            const feedbackEl = document.getElementById('modal-feedback');

            // 每次開啟皆重置表單（不記憶票所）
            stationInput.value = '';
            govInput.value = '';
            refInput.value = '';
            feedbackEl.classList.add('hidden');
            submitBtn.disabled = false;

            if (itemKey === 'setup') {
                turnoutBox.classList.add('hidden');
                turnoutBox.classList.remove('flex');
                govInput.required = false;
                refInput.required = false;
                submitBtn.textContent = '場佈已完成';
                submitBtn.className = 'px-6 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-black text-base shadow-md transition';
                resultBtn.textContent = '回報結果 >';
                resultBtn.classList.remove('hidden');
            } else if (itemKey === 'courier') {
                turnoutBox.classList.add('hidden');
                turnoutBox.classList.remove('flex');
                govInput.required = false;
                refInput.required = false;
                submitBtn.textContent = '出發';
                submitBtn.className = 'w-48 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-black text-lg shadow-md transition';
                resultBtn.classList.add('hidden');
            } else {
                // turnout_1 ~ turnout_4
                turnoutBox.classList.remove('hidden');
                turnoutBox.classList.add('flex');
                govInput.required = true;
                refInput.required = true;
                submitBtn.textContent = '回報';
                submitBtn.className = 'px-7 py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-black text-base shadow-md transition';
                resultBtn.textContent = '查看結果 >';
                resultBtn.classList.remove('hidden');
            }

            document.getElementById('report-modal-overlay').classList.add('open');
            setTimeout(() => stationInput.focus(), 120);
        }

        function closeReportModal() {
            document.getElementById('report-modal-overlay').classList.remove('open');
            activeModalItem = null;
        }

        function showModalFeedback(type, text) {
            const el = document.getElementById('modal-feedback');
            el.textContent = text;
            el.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'border', 'border-emerald-400', 'bg-red-100', 'text-red-800', 'border-red-400');
            if (type === 'success') {
                el.classList.add('bg-emerald-100', 'text-emerald-800', 'border', 'border-emerald-400');
            } else {
                el.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-400');
            }
        }

        // === 4. 送出回報至 GAS 寫入「回報_總接收區」 ===
        async function submitPortalReport(e) {
            e.preventDefault();
            if (!activeModalItem) return;

            const stationStr = document.getElementById('modal-station-id').value.trim();
            const stationNum = parseInt(stationStr, 10);
            if (!/^\d{4}$/.test(stationStr) || stationNum < 1282 || stationNum > 1419) {
                showModalFeedback('error', '⚠️ 請輸入有效的 4 碼票所編號（1282～1419）！');
                document.getElementById('modal-station-id').focus();
                return;
            }

            // 前端再檢查一次是否還在時段內
            const state = getItemState(activeModalItem, getSyncedNowMs());
            if (state !== 'open') {
                showModalFeedback('error', '⚠️ 目前已非開放填報時段，無法送出！');
                renderAllUI();
                return;
            }

            const payload = {
                action: 'submitPortalReport',
                itemKey: activeModalItem.key,
                stationId: stationStr
            };

            const isTurnout = activeModalItem.key.startsWith('turnout_');
            if (isTurnout) {
                const govStr = document.getElementById('modal-gov-count').value.trim();
                const refStr = document.getElementById('modal-ref-count').value.trim();
                if (!/^[1-9]\d*$/.test(govStr) || !/^[1-9]\d*$/.test(refStr)) {
                    showModalFeedback('error', '⚠️ 公職與公投投票人數皆必須為大於 0 的「正整數」！');
                    return;
                }
                payload.govCount = parseInt(govStr, 10);
                payload.refCount = parseInt(refStr, 10);
            }

            const submitBtn = document.getElementById('btn-modal-submit');
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = '傳送中...';
            document.getElementById('modal-feedback').classList.add('hidden');

            try {
                const res = await fetch(GAS_API_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                const json = await res.json();

                if (json.status === 'success') {
                    showModalFeedback('success', json.message);
                    showToast(json.message, 4000);
                } else {
                    showModalFeedback('error', '❌ ' + (json.message || '送出失敗'));
                }
            } catch (err) {
                showModalFeedback('error', '❌ 網路連線異常，請確認訊號後再試！');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        }

        // === 5. 站內滿版純網頁報表檢視視窗（繞過 Android 選取帳戶、支援自由縮放與雙指捏合） ===
        function getDefaultSheetZoomPct() {
            try {
                const saved = parseInt(localStorage.getItem(STORAGE_SHEET_ZOOM_KEY), 10);
                if (!isNaN(saved) && saved >= 25 && saved <= 250) return saved;
            } catch (e) {}
            return window.innerWidth < 640 ? 65 : 100;
        }

        function applySheetZoomToIframe() {
            const slider = document.getElementById('sheet-zoom-slider');
            const presetBtn = document.getElementById('btn-zoom-preset');
            if (slider) slider.value = String(currentSheetZoomPct);
            if (presetBtn) presetBtn.textContent = `${currentSheetZoomPct}%`;

            if (activeSheetIframe) {
                const scale = currentSheetZoomPct / 100;
                const invPct = (100 / scale).toFixed(4);
                activeSheetIframe.style.width = `${invPct}%`;
                activeSheetIframe.style.height = `${invPct}%`;
                activeSheetIframe.style.transform = `scale(${scale})`;
                activeSheetIframe.style.transformOrigin = '0 0';
            }
        }

        function setSheetZoom(val) {
            const parsed = Math.round(Number(val));
            if (isNaN(parsed)) return;
            currentSheetZoomPct = Math.max(25, Math.min(250, parsed));
            applySheetZoomToIframe();
            try {
                localStorage.setItem(STORAGE_SHEET_ZOOM_KEY, String(currentSheetZoomPct));
            } catch (e) {}
        }

        function stepSheetZoom(delta) {
            setSheetZoom(currentSheetZoomPct + delta);
        }

        function cycleSheetZoomPreset() {
            const nextPreset = ZOOM_PRESETS.find(p => p > currentSheetZoomPct) || ZOOM_PRESETS[0];
            setSheetZoom(nextPreset);
            showToast(`🔍 縮放比例已切換至 ${nextPreset}%`, 1600);
        }

        function setPinchMode(enabled) {
            isPinchMode = Boolean(enabled);
            const shield = document.getElementById('sheet-pinch-shield');
            const btn = document.getElementById('btn-pinch-mode');
            if (shield) shield.classList.toggle('active', isPinchMode);
            if (btn) {
                if (isPinchMode) {
                    btn.className = 'h-8 px-2.5 rounded-lg bg-amber-500 text-white border border-amber-600 font-black text-xs shrink-0 transition whitespace-nowrap shadow-sm';
                    btn.textContent = '🤏 縮放中';
                } else {
                    btn.className = 'h-8 px-2.5 rounded-lg bg-white hover:bg-amber-50 active:scale-95 border border-slate-300 text-slate-700 font-bold text-xs shrink-0 transition whitespace-nowrap';
                    btn.textContent = '🤏 雙指';
                }
            }
        }

        function togglePinchMode() {
            setPinchMode(!isPinchMode);
            if (isPinchMode) {
                showToast('🤏 請用兩根手指捏合縮放，放開自動恢復滑動瀏覽', 2400);
            }
        }

        function initPinchShieldEvents() {
            const shield = document.getElementById('sheet-pinch-shield');
            if (!shield) return;

            const getTouchDist = (t1, t2) => Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);

            shield.addEventListener('touchstart', (e) => {
                if (!isPinchMode) return;
                if (e.touches.length === 2) {
                    e.preventDefault();
                    pinchStartDist = getTouchDist(e.touches[0], e.touches[1]);
                    pinchStartZoom = currentSheetZoomPct;
                    didPinchMove = true;
                }
            }, { passive: false });

            shield.addEventListener('touchmove', (e) => {
                if (!isPinchMode || e.touches.length !== 2 || pinchStartDist <= 0) return;
                e.preventDefault();
                const dist = getTouchDist(e.touches[0], e.touches[1]);
                const nextZoom = Math.round((pinchStartZoom * (dist / pinchStartDist)) / 5) * 5;
                setSheetZoom(nextZoom);
            }, { passive: false });

            shield.addEventListener('touchend', (e) => {
                if (!isPinchMode) return;
                if (didPinchMove && e.touches.length < 2) {
                    didPinchMove = false;
                    pinchStartDist = 0;
                    setPinchMode(false);
                    showToast(`✅ 已固定在 ${currentSheetZoomPct}%，可直接滑動檢視`, 1800);
                }
            });

            shield.addEventListener('touchcancel', () => {
                didPinchMove = false;
                pinchStartDist = 0;
                setPinchMode(false);
            });

            // 若誤觸開啟雙指模式，單點一下即可關閉
            shield.addEventListener('click', () => {
                if (isPinchMode && !didPinchMove) {
                    setPinchMode(false);
                }
            });
        }

        function mountSheetIframe(baseUrl) {
            const body = document.getElementById('sheet-viewer-body');
            const loading = document.getElementById('sheet-viewer-loading');
            if (!body || !loading) return;

            loading.classList.remove('hidden');
            body.innerHTML = '';
            activeSheetIframe = null;
            setPinchMode(false);

            if (viewerFallbackTimer) clearTimeout(viewerFallbackTimer);

            const iframe = document.createElement('iframe');
            iframe.src = `${baseUrl}&widget=true&headers=false&_t=${Date.now()}`;
            iframe.style.border = '0';
            iframe.style.display = 'block';
            iframe.style.backgroundColor = '#ffffff';
            iframe.setAttribute('loading', 'eager');

            activeSheetIframe = iframe;
            applySheetZoomToIframe();

            iframe.onload = () => {
                loading.classList.add('hidden');
                if (viewerFallbackTimer) clearTimeout(viewerFallbackTimer);
            };

            // 防呆：避免部分行動網路緩慢導致讀取罩久未消失
            viewerFallbackTimer = setTimeout(() => {
                loading.classList.add('hidden');
            }, 6000);

            body.appendChild(iframe);
        }

        function openSheetViewer(mode) {
            const overlay = document.getElementById('sheet-viewer-overlay');
            const titleEl = document.getElementById('sheet-viewer-title');

            currentSheetZoomPct = getDefaultSheetZoomPct();
            applySheetZoomToIframe();

            if (mode === 'progress') {
                titleEl.textContent = '📊 一二聯進度一覽表';
                currentViewerBaseUrl = PROGRESS_SHEET_URL;
            } else {
                titleEl.textContent = '📋 票所回報結果一覽表';
                currentViewerBaseUrl = RESULT_SHEET_URL;
            }

            overlay.classList.add('open');
            mountSheetIframe(currentViewerBaseUrl);
        }

        function reloadSheetViewer() {
            if (!currentViewerBaseUrl) return;
            mountSheetIframe(currentViewerBaseUrl);
            showToast('🔄 已重新抓取最新報表資料');
        }

        function closeSheetViewer() {
            const overlay = document.getElementById('sheet-viewer-overlay');
            const body = document.getElementById('sheet-viewer-body');
            if (viewerFallbackTimer) clearTimeout(viewerFallbackTimer);
            setPinchMode(false);
            if (overlay) overlay.classList.remove('open');
            // 關閉時立即移除 iframe，徹底釋放手機記憶體
            if (body) body.innerHTML = '';
            activeSheetIframe = null;
            currentViewerBaseUrl = '';
        }

        // === 6. 動態時鐘與自動時段切換 ===
        function tickClock() {
            const parts = formatTaipeiParts(getSyncedNowMs());
            document.getElementById('live-date').textContent = parts.dateStr;
            document.getElementById('live-clock').textContent = parts.timeStr;

            // 每跨越整分鐘自動重算一次按鈕開關狀態，準點自動解鎖／鎖定
            if (parts.minuteKey !== lastRenderMinuteKey) {
                lastRenderMinuteKey = parts.minuteKey;
                renderAllUI();
            }
        }

        let toastTimer = null;
        function showToast(msg, duration = 3200) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => el.classList.remove('show'), duration);
        }

        // 啟動初始化
        window.addEventListener('DOMContentLoaded', () => {
            tickClock();
            setInterval(tickClock, 1000);
            initPinchShieldEvents();
            fetchPortalConfig(false);

            // 每 2 分鐘靜默同步一次「入口設定」，確保現場臨時調整時段能自動生效
            setInterval(() => fetchPortalConfig(false), 120000);
        });

        // 註冊 PWA Service Worker（僅於正式 HTTPS 或本機伺服器環境註冊，避免預覽沙盒報錯）
        if ('serviceWorker' in navigator && (window.location.protocol === 'https:' || window.location.hostname === 'localhost')) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(() => console.log('✅ Portal ServiceWorker 註冊成功'))
                    .catch(err => console.log('❌ ServiceWorker 註冊失敗:', err));
            });
        }
    </script>
</body>
</html>
