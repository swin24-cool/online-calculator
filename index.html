<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>線上投開票所試算器 (PWA版)</title>

    <!-- PWA 必備標籤 (讓手機識別這是一個 APP) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a90e2">
    <link rel="apple-touch-icon" href="PWA_icon(192x192).png">

    <style>
        /* 這裡保留您原本的 CSS 樣式 */
        body { font-family: '微軟正黑體', sans-serif; background-color: #f8f9fa; margin: 0; padding: 0; }
        
        /* 底部控制列的固定樣式 */
        .bottom-bar { 
            display: flex; justify-content: space-between; align-items: flex-end; 
            padding: 15px; background: #fff; border-top: 2px solid #ccc; 
            position: fixed; bottom: 0; width: 100%; box-sizing: border-box;
            z-index: 1000;
        }
        .btn { padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; border: none; font-size: 1rem; }
        .btn-primary { background-color: #4a90e2; color: white; }
    </style>
</head>
<body>

    <!-- 頂部輸入區塊 -->
    <div style="padding: 15px; background: #fff; border-bottom: 2px solid #ccc;">
        投開票所編號：<input type="text" id="stationId" style="padding: 5px; font-size: 1rem;">
        <button class="btn btn-primary" onclick="loadStationData()">輸入</button>
        <span style="color: red; font-size: 0.9rem; margin-left: 10px;">輸入票所編號(1282-1419)後才可試算！</span>
    </div>

    <!-- ========================================== -->
    <!-- 這裡保留您原本龐大的表格產生區與連續模式小鍵盤 -->
    <div id="formContainer" style="padding: 15px; margin-bottom: 100px;">
        <!-- 您原本的 HTML 表格內容放在這裡 -->
    </div>
    <!-- ========================================== -->

    <!-- 底部控制區 (已更新：查看結果、傳送成功常駐顯示) -->
    <div class="bottom-bar">
        <div>
            <button class="btn" style="background-color: #f8d7da; color: #721c24;">清除全部</button>
        </div>
        
        <div style="display: flex; gap: 10px; align-items: center;">
            <button class="btn" style="background-color: #d4edda; color: #155724;">鎖住/解鎖</button>
            <button class="btn" style="background-color: #fff3cd; border: 1px solid #ffeeba;">載入圖檔(公職)</button>
            <button class="btn" style="background-color: #fff3cd; border: 1px solid #ffeeba;">載入圖檔(公投)</button>
        </div>

        <!-- 【全新升級】右下角傳送與查看結果按鈕區 -->
        <div style="display: flex; flex-direction: column; align-items: center; position: relative;">
            <!-- 成功訊息，預設隱藏，傳送成功後會一直顯示直到下次切換 -->
            <div id="successMsgText" style="color: red; font-weight: bold; font-size: 1.3rem; margin-bottom: 5px; display: none; text-shadow: 1px 1px 2px rgba(0,0,0,0.1);">
                傳送成功！
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="button" class="btn btn-primary" id="btnSubmit" onclick="submitData()">傳送資料(含A3報表圖)</button>
                <!-- 查看結果按鈕，預設先連至 Google 新聞 -->
                <button type="button" class="btn" style="background-color: #e2e8f0; border: 1px solid #94a3b8; color: #333;" onclick="window.open('https://news.google.com', '_blank')">查看結果</button>
            </div>
        </div>
    </div>

    <!-- 核心 JavaScript 邏輯 -->
    <script>
        let currentElectionType = 'public'; // 'public' 或 'referendum'
        let currentStation = null;

        // ==========================================
        // 1. 載入票所資料 (結合 PWA 本機離線快取)
        // ==========================================
        function loadStationData() {
            const stationId = document.getElementById('stationId').value.trim();
            if (!stationId) return alert('請輸入票所編號');

            // 每次切換票所時，隱藏右下角的「傳送成功！」文字
            const successMsg = document.getElementById('successMsgText');
            if (successMsg) successMsg.style.display = 'none';

            if (navigator.onLine) {
                if (typeof google !== 'undefined' && google.script) {
                    google.script.run
                        .withSuccessHandler(function(res) {
                            // 有網路時：永久下載最新資料到手機記憶體 (LocalStorage)
                            localStorage.setItem('station_' + stationId, JSON.stringify(res));
                            currentStation = res;
                            renderStation(res); // 呼叫您原本的渲染表格函數
                        })
                        .getInitialData(stationId);
                }
            } else {
                // 離線無網路時：從手機記憶體抓取
                const cached = localStorage.getItem('station_' + stationId);
                if (cached) {
                    currentStation = JSON.parse(cached);
                    renderStation(currentStation); // 呼叫您原本的渲染表格函數
                    alert('⚡ 目前為無網路離線模式，已成功載入本機暫存資料！');
                } else {
                    alert('⚠️ 離線狀態下找不到此票所的暫存資料，請確認早上有連線開啟過。');
                }
            }
        }

        // ==========================================
        // 2. 傳送資料 (防呆保護與 G/R 序號標準化)
        // ==========================================
        function submitData() {
            const successMsg = document.getElementById('successMsgText');
            if (successMsg) successMsg.style.display = 'none';

            // 離線防呆：保護資料不遺失
            if (!navigator.onLine) {
                alert('⚠️ 目前無網路連線！\n資料已安全保留在畫面上，請移動至一樓或戶外有訊號處，再按一次傳送。');
                return;
            }

            if (!currentStation) return alert('請先載入票所資料');

            const btn = document.getElementById('btnSubmit');
            btn.innerText = '傳送中...'; 
            btn.disabled = true;

            // 自動產生標準化交易序號 (如 1316-G-5712 或 1316-R-9988)
            const typeChar = currentElectionType === 'public' ? 'G' : 'R';
            const randomSuffix = Math.floor(1000 + Math.random() * 9000);
            const txId = `${currentStation.stationId}-${typeChar}-${randomSuffix}`;

            // TODO: 這裡請保留您原本抓取表格 input 數值的邏輯
            const payloadData = {}; // payloadData = gatherFormData(); 

            const payload = {
                txId: txId,
                stationId: currentStation.stationId,
                electionType: currentElectionType,
                data: payloadData
            };

            if (typeof google !== 'undefined' && google.script) {
                google.script.run
                    .withSuccessHandler(function(res) {
                        btn.innerText = '傳送資料(含A3報表圖)'; 
                        btn.disabled = false;
                        
                        // 成功後，將「傳送成功！」文字永久顯示出來
                        if (successMsg) successMsg.style.display = 'block';
                    })
                    .withFailureHandler(function(err) {
                        btn.innerText = '傳送資料(含A3報表圖)'; 
                        btn.disabled = false;
                        alert('傳送失敗：' + err.message);
                    })
                    .submitElectionData(payload);
            }
        }

        // 這裡保留您原本的 renderStation(), runValidation() 等核心函數
        function renderStation(data) {
            console.log("載入資料:", data);
        }

        // ==========================================
        // 3. PWA Service Worker 註冊 (秒開與快取網頁資源)
        // ==========================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').then(function(registration) {
                    console.log('ServiceWorker 註冊成功！');
                }).catch(function(err) {
                    console.log('ServiceWorker 註冊失敗: ', err);
                });
            });
        }
    </script>
</body>
</html>
