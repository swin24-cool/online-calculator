<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>萬華區選務計票後端調閱系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang TC', '微軟正黑體', sans-serif; background-color: #f1f5f9; height: 100vh; overflow: hidden; margin: 0; }
        .top-bar { background-color: #1e293b; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); z-index: 10; flex-shrink: 0; }
        .main-container { display: flex; flex: 1; height: calc(100vh - 60px); overflow: hidden; }
        .sidebar { width: 320px; background-color: white; border-right: 1px solid #cbd5e1; display: flex; flex-direction: column; z-index: 5; }
        .content-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; background-color: #f8fafc; }
        
        .tab-container { display: flex; border-bottom: 2px solid #e2e8f0; }
        .tab { flex: 1; text-align: center; padding: 12px; font-weight: bold; cursor: pointer; color: #64748b; background-color: #f8fafc; transition: all 0.2s; }
        .tab.active { background-color: #1e293b; color: white; border-bottom: 2px solid #3b82f6; }
        
        .list-container { flex: 1; overflow-y: auto; padding: 10px; }
        .list-item { background: white; border: 1px solid #e2e8f0; border-radius: 6px; padding: 10px; margin-bottom: 8px; cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: transform 0.1s, border-color 0.2s; }
        .list-item:hover { border-color: #94a3b8; transform: translateY(-1px); }
        .list-item.active { border-color: #3b82f6; background-color: #eff6ff; box-shadow: 0 0 0 1px #3b82f6; }
        .list-item.status-green { border-left: 6px solid #10b981; }
        .list-item.status-yellow { border-left: 6px solid #eab308; }
        .list-item.status-red { border-left: 6px solid #ef4444; }
        
        .data-panel { height: 40%; background: white; border-bottom: 2px solid #cbd5e1; overflow-y: auto; padding: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); z-index: 2; flex-shrink: 0; }
        .image-panel { flex: 1; background: #e2e8f0; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; background: white; }
        th, td { border: 1px solid #cbd5e1; padding: 6px 8px; text-align: center; font-size: 14px; }
        th { background-color: #f1f5f9; font-weight: bold; color: #334155; }
        .highlight-cell { font-weight: bold; color: #0f172a; }
        .bg-green-100 { background-color: #d1fae5 !important; }
        
        .toolbar { padding: 10px; background: rgba(255,255,255,0.9); border-bottom: 1px solid #cbd5e1; display: flex; gap: 10px; align-items: center; z-index: 10; backdrop-filter: blur(4px); }
        .canvas-container { flex: 1; overflow: auto; position: relative; display: flex; justify-content: center; align-items: flex-start; padding: 20px; }
        #reportImage { max-width: none; transform-origin: top center; transition: transform 0.1s ease-out; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        
        .btn { padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; text-align: center; border: 1px solid transparent; transition: all 0.15s; }
        .btn-blue { background-color: #3b82f6; color: white; }
        .btn-blue:hover { background-color: #2563eb; }
        .btn-gray { background-color: #e2e8f0; color: #334155; border-color: #cbd5e1; }
        .btn-gray:hover { background-color: #cbd5e1; }
        .btn-red { background-color: #ef4444; color: white; }
        .btn-red:hover { background-color: #dc2626; }
        
        /* 提示泡泡 */
        .toast-msg { position: fixed; bottom: 30px; right: 30px; background-color: rgba(30, 41, 59, 0.95); color: white; padding: 12px 24px; border-radius: 8px; font-size: 16px; opacity: 0; transition: opacity 0.3s; z-index: 10002; pointer-events: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); font-weight: bold; }
        .toast-msg.show { opacity: 1; }

        /* 登入視窗與背景遮罩 */
        #login-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 9999; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .login-box { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); width: 100%; max-width: 380px; text-align: center; }
    </style>
</head>
<body>

<!-- 🔒 密碼登入視窗 -->
<div id="login-overlay">
    <div class="login-box">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">🔒 系統安全驗證</h2>
        <p class="text-slate-500 mb-6 text-sm">請輸入存取密碼以進入後端調閱平台</p>
        <form id="login-form" onsubmit="verifyLogin(event)">
            <input type="password" id="sys-password" class="w-full border-2 border-slate-300 rounded-lg px-4 py-3 mb-4 font-bold text-center text-lg tracking-widest focus:outline-none focus:border-blue-500 transition-colors" placeholder="請輸入密碼" required autofocus>
            <button type="submit" id="btn-login" class="w-full bg-blue-600 text-white font-bold text-lg py-3 rounded-lg hover:bg-blue-700 transition shadow-md">登入系統</button>
        </form>
        <div id="login-error" class="text-red-500 font-bold mt-4 text-sm hidden">❌ 密碼錯誤，請重新輸入！</div>
    </div>
</div>

<!-- 主要內容 (驗證成功前隱藏) -->
<div id="app-wrapper" class="flex flex-col h-full opacity-0 pointer-events-none transition-opacity duration-500">
    <div class="top-bar">
        <div class="text-xl font-bold tracking-wider">📊 萬華區選務計票 後端調閱系統</div>
        <div class="flex gap-4 items-center">
            <label class="font-bold text-sm text-slate-300">目前帳號身分：</label>
            <!-- 💡 調整後的管理者清單 -->
            <select id="user-role" class="border border-gray-400 rounded px-3 py-1 font-bold text-slate-800 bg-white">
                <option value="">-- 請選擇身分 --</option>
                <optgroup label="檢核人員 (可鎖定與檢核)">
                    <option value="檢核人員 A">檢核人員 A</option>
                    <option value="檢核人員 B">檢核人員 B</option>
                    <option value="檢核人員 C">檢核人員 C</option>
                    <option value="檢核人員 D">檢核人員 D</option>
                    <option value="檢核人員 E">檢核人員 E</option>
                    <option value="檢核人員 F">檢核人員 F</option>
                    <option value="檢核人員 G">檢核人員 G</option>
                </optgroup>
                <optgroup label="系統管理者 (僅可強制解鎖)">
                    <option value="AdminX">管理員 X</option>
                    <option value="AdminY">管理員 Y</option>
                    <option value="AdminZ">管理員 Z</option>
                </optgroup>
            </select>
            <button type="button" onclick="fetchListData(false)" class="bg-blue-600 border border-blue-400 px-4 py-1 rounded hover:bg-blue-500 font-bold shadow-sm text-white">🔄 重新載入清單</button>
        </div>
    </div>

    <div class="main-container">
        <!-- 左側清單 -->
        <div class="sidebar">
            <div class="tab-container">
                <div class="tab active" id="tab-gov" onclick="switchTab('gov')">公職報表</div>
                <div class="tab" id="tab-ref" onclick="switchTab('ref')">公投報表</div>
            </div>
            
            <!-- 公職清單 -->
            <div class="list-container" id="list-gov">
                <div class="text-center text-slate-400 py-10 font-bold">載入中...</div>
            </div>
            
            <!-- 公投清單 -->
            <div class="list-container hidden" id="list-ref">
                <div class="text-center text-slate-400 py-10 font-bold">載入中...</div>
            </div>
        </div>

        <!-- 右側內容 -->
        <div class="content-area">
            <!-- 上方數據檢核區 -->
            <div class="data-panel" id="dataPanel">
                <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-200">
                    <div class="flex items-center gap-3">
                        <span class="text-2xl font-black text-slate-800 tracking-wide" id="detail-station">請選擇票所</span>
                        <span class="px-2 py-1 bg-slate-100 text-slate-600 rounded text-sm font-bold border border-slate-300" id="detail-txid">ID: -</span>
                    </div>
                    
                    <div class="flex items-center gap-3 bg-slate-50 p-2 rounded-lg border border-slate-200 shadow-sm">
                        <label class="font-bold text-slate-700">檢核判定：</label>
                        <select id="status-select" class="border-2 border-slate-300 rounded px-3 py-1.5 font-bold outline-none focus:border-blue-500">
                            <option value="">-- 尚未判定 --</option>
                            <option value="一二聯報表ok(綠)">🟢 一二聯報表ok (綠)</option>
                            <option value="缺二聯報表(黃)">🟡 缺二聯報表 (黃)</option>
                            <option value="資料錯誤(紅)">🔴 資料錯誤 (紅)</option>
                        </select>
                        <button onclick="updateStatus()" class="btn btn-blue shadow-sm">更新狀態</button>
                        <button id="btn-unlock" onclick="unlockRecord()" class="btn btn-red shadow-sm" style="display:none;">強制解鎖</button>
                    </div>
                </div>

                <div id="table-container" class="text-slate-500 text-center py-10 font-bold">點擊左側清單載入報表數據</div>
            </div>

            <!-- 下方圖檔檢視區 -->
            <div class="image-panel">
                <div class="toolbar">
                    <span class="font-bold text-slate-700 mr-2">📷 原始報表圖檔：</span>
                    <button class="btn btn-gray" onclick="zoomImage(0.1)">🔍 放大</button>
                    <button class="btn btn-gray" onclick="zoomImage(-0.1)">🔍 縮小</button>
                    <button class="btn btn-gray" onclick="resetZoom()">🔄 原始大小</button>
                    <button class="btn btn-gray ml-auto" onclick="printImage()">🖨️ 列印圖檔</button>
                </div>
                <div class="canvas-container" id="canvasContainer">
                    <div id="image-loading" class="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 font-bold text-slate-500 hidden">圖檔載入中...</div>
                    <img id="reportImage" src="" alt="報表圖檔" style="display:none;">
                </div>
            </div>
        </div>
    </div>
</div>

<div id="print-area" style="display:none;"><img id="print-img" src=""></div>
<div class="toast-msg" id="toast"></div>

<script>
    // ⚠️ 請替換為您專屬的 GAS 網址！
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbw7-9Axst2b44keFWFllxzuLWGJPuWoVOijT1-C79K-6AkqPqEwQ6iL02zzjqlalNwhuA/exec';
    
    let sessionToken = null; // 登入成功後保存的憑證
    let rawData = { govList: [], refList: [] };
    let currentListType = 'gov';
    let currentRecord = null;
    let currentTxId = null;
    let imageScale = 1.0;
    
    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

    // === 🔒 登入驗證功能 ===
    async function verifyLogin(event) {
        event.preventDefault();
        const pwdInput = document.getElementById('sys-password');
        const btnLogin = document.getElementById('btn-login');
        const errorMsg = document.getElementById('login-error');
        
        const pwd = pwdInput.value.trim();
        if (!pwd) return;

        btnLogin.textContent = "驗證中...";
        btnLogin.disabled = true;
        errorMsg.classList.add('hidden');

        try {
            const res = await fetch(GAS_API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'verifyPassword', password: pwd })
            });
            const json = await res.json();
            
            if (json.status === 'success') {
                sessionToken = json.token;
                document.getElementById('login-overlay').style.display = 'none';
                
                const appWrapper = document.getElementById('app-wrapper');
                appWrapper.classList.remove('opacity-0', 'pointer-events-none');
                
                showToast("✅ 登入成功，系統已解鎖！");
                fetchListData(false); // 登入成功後才開始抓資料
            } else {
                errorMsg.classList.remove('hidden');
                pwdInput.value = '';
                pwdInput.focus();
            }
        } catch (err) {
            errorMsg.textContent = "❌ 連線失敗，請檢查網路！";
            errorMsg.classList.remove('hidden');
        } finally {
            btnLogin.textContent = "登入系統";
            btnLogin.disabled = false;
        }
    }

    // === 撈取清單 (帶有 Token) ===
    async function fetchListData(isSilent = false) {
        if (!sessionToken) return;
        
        try {
            if (!isSilent) {
                document.getElementById('list-gov').innerHTML = '<div class="text-center text-slate-400 py-10 font-bold">🔄 載入中...</div>';
                document.getElementById('list-ref').innerHTML = '<div class="text-center text-slate-400 py-10 font-bold">🔄 載入中...</div>';
            }

            const res = await fetch(`${GAS_API_URL}?action=getDashboardData&token=${sessionToken}`);
            const json = await res.json();
            
            if (json.status === 'success') {
                rawData = json.data;
                renderList('gov');
                renderList('ref');
                if (!isSilent) showToast('✅ 清單已更新');
            } else {
                if(json.message.includes('憑證')) {
                    alert('登入時效過期或無效，請重新整理網頁！');
                } else {
                    showToast('❌ 讀取失敗: ' + json.message);
                }
            }
        } catch (err) {
            showToast('❌ 網路連線錯誤');
        }
    }

    function switchTab(type) {
        currentListType = type;
        document.getElementById('tab-gov').classList.toggle('active', type === 'gov');
        document.getElementById('tab-ref').classList.toggle('active', type === 'ref');
        
        document.getElementById('list-gov').style.display = type === 'gov' ? 'block' : 'none';
        document.getElementById('list-ref').style.display = type === 'ref' ? 'block' : 'none';
    }

    function renderList(type) {
        const container = document.getElementById(`list-${type}`);
        const listData = type === 'gov' ? rawData.govList : rawData.refList;
        
        container.innerHTML = '';
        if (listData.length === 0) {
            container.innerHTML = '<div class="text-center text-slate-400 py-10 font-bold">目前無資料</div>';
            return;
        }

        const table = document.createElement('table');
        table.className = "w-full text-left";
        table.innerHTML = `
            <thead>
                <tr>
                    <th class="py-2 px-2 bg-slate-800 text-white border-none rounded-tl">票所編號</th>
                    <th class="py-2 px-2 bg-slate-800 text-white border-none">回傳時間</th>
                    <th class="py-2 px-2 bg-slate-800 text-white border-none rounded-tr">狀態</th>
                </tr>
            </thead>
            <tbody></tbody>
        `;
        const tbody = table.querySelector('tbody');

        listData.forEach(item => {
            const row = document.createElement('tr');
            row.className = `list-item border-b border-slate-200 cursor-pointer hover:bg-slate-50 transition`;
            if (currentTxId === item.txId) row.classList.add('bg-blue-50');

            let statusLight = '<span class="w-3 h-3 rounded-full bg-slate-300 inline-block mr-1"></span> 未處理';
            if (item.status === '一二聯報表ok(綠)') statusLight = '<span class="w-3 h-3 rounded-full bg-green-500 inline-block mr-1"></span> OK';
            if (item.status === '缺二聯報表(黃)') statusLight = '<span class="w-3 h-3 rounded-full bg-yellow-400 inline-block mr-1"></span> 缺二聯';
            if (item.status === '資料錯誤(紅)') statusLight = '<span class="w-3 h-3 rounded-full bg-red-500 inline-block mr-1"></span> 錯誤';
            
            let lockedTag = item.lockedBy ? `<div class="text-[10px] text-red-500 font-bold mt-1">🔒 ${item.lockedBy} 處理中</div>` : '';

            row.innerHTML = `
                <td class="py-3 px-2 font-black text-lg text-slate-700 border-none">${item.stationId}</td>
                <td class="py-3 px-2 font-mono text-sm text-slate-600 border-none">${item.timestamp}</td>
                <td class="py-3 px-2 text-sm font-bold border-none">${statusLight}${lockedTag}</td>
            `;
            
            row.onclick = () => loadRecord(item, type);
            tbody.appendChild(row);
        });
        
        container.appendChild(table);
    }

    async function loadRecord(item, type) {
        const role = document.getElementById('user-role').value;
        if (!role) { showToast("⚠️ 請先於右上角選擇帳號身分，才能調閱資料！"); return; }
        
        let isClosed = item.status === '一二聯報表ok(綠)';
        let isAdmin = role.startsWith('Admin');

        if (isClosed && !isAdmin) {
            showToast(`⚠️ 此筆資料已結案，僅限系統管理者操作與解鎖！`);
            return;
        }

        if (item.lockedBy && item.lockedBy !== role && !isClosed && !isAdmin) {
            showToast(`⚠️ 此筆資料正由【${item.lockedBy}】檢核中！`);
            return;
        }

        currentRecord = item;
        currentTxId = item.txId;
        currentListType = type;
        
        document.getElementById('detail-station').textContent = `票所：${item.stationId}`;
        document.getElementById('detail-txid').textContent = `ID: ${item.txId}`;
        document.getElementById('status-select').value = item.status || '';
        
        document.getElementById('btn-unlock').style.display = (isAdmin && (item.lockedBy || item.status)) ? 'block' : 'none';

        // 💡 只有非管理員才搶檢核權；管理員純看
        if (!isClosed && item.lockedBy !== role && !isAdmin) {
            await fetch(GAS_API_URL, {
                method: 'POST', body: JSON.stringify({ action: 'updateStatus', txId: currentTxId, lockedBy: role, token: sessionToken })
            });
            item.lockedBy = role;
            renderList(type);
        }

        renderTable(item);
        loadCanvasImage(item.stationId, type);
    }

    function renderTable(item) {
        const container = document.getElementById('table-container');
        container.innerHTML = '';
        
        const types = currentListType === 'gov' ? ['市長', '區域議員', '平地原住民議員', '山地原住民議員', '里長'] : ['公投'];
        
        types.forEach(tName => {
            if (item.records[tName]) {
                const d = item.records[tName];
                let candsHtml = '';
                if (tName === '公投') {
                    candsHtml = `<th>同意</th><th>不同意</th>`;
                    candsHtml += `<tr><td class="font-bold text-lg">${d.candidates[0]}</td><td class="font-bold text-lg">${d.candidates[1]}</td></tr>`;
                } else {
                    let h1 = '', h2 = '';
                    d.candidates.forEach((c, idx) => {
                        if (c !== '') { h1 += `<th>${idx+1}</th>`; h2 += `<td class="font-bold text-lg">${c}</td>`; }
                    });
                    if(h1 === '') return; 
                    candsHtml = h1 + `</tr><tr>` + h2;
                }

                const s = d.stats;
                const isMatch = Number(s.electors) === Number(s.check) && Number(s.check) > 0;
                const checkColor = isMatch ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700';

                container.innerHTML += `
                    <div class="mb-4 font-bold text-blue-900 border-l-4 border-blue-500 pl-2 text-lg">${tName}</div>
                    <div style="overflow-x:auto;">
                        <table class="mb-6 whitespace-nowrap">
                            <thead>
                                <tr>${tName === '公投' ? candsHtml : `<tr>${candsHtml}</tr>`}</tr>
                            </thead>
                        </table>
                        <table class="whitespace-nowrap">
                            <thead>
                                <tr>
                                    <th>有效票</th><th>無效票</th><th>投票數</th>
                                    <th>已領未投</th><th>發出票數</th><th>用餘票數</th>
                                    <th>選舉人數</th><th>檢查值</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td class="highlight-cell">${s.valid}</td><td class="highlight-cell">${s.invalid}</td><td class="highlight-cell">${s.total}</td>
                                    <td class="highlight-cell">${s.issuedNotVoted}</td><td class="highlight-cell">${s.issued}</td><td class="highlight-cell">${s.remaining}</td>
                                    <td class="highlight-cell">${s.electors}</td><td class="highlight-cell ${checkColor}">${s.check}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            }
        });
    }

    async function updateStatus() {
        if (!currentTxId) return;
        const newStatus = document.getElementById('status-select').value;
        const role = document.getElementById('user-role').value;
        
        if (!role) { showToast("⚠️ 請先選擇身分"); return; }

        let isAdmin = role.startsWith('Admin');
        
        // 💡 阻擋管理員修改狀態燈號
        if (isAdmin) {
            showToast("⚠️ 系統管理員僅具備【純調閱】與【強制解鎖】權限，不可判定燈號。");
            document.getElementById('status-select').value = currentRecord.status || '';
            return;
        }

        if (currentRecord && currentRecord.status === '一二聯報表ok(綠)' && !isAdmin) {
            showToast("⚠️ 此筆資料已結案，僅限系統管理者解鎖！");
            return;
        }

        let lockedBy = role;
        if (newStatus === '一二聯報表ok(綠)') lockedBy = ''; 

        try {
            const res = await fetch(GAS_API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'updateStatus', txId: currentTxId, status: newStatus, lockedBy: lockedBy, token: sessionToken })
            });
            const json = await res.json();
            if (json.status === 'success') {
                showToast("✅ 狀態已更新");
                currentRecord.status = newStatus;
                currentRecord.lockedBy = lockedBy;
                renderList(currentListType);
            } else { showToast("❌ 更新失敗"); }
        } catch (err) { showToast("❌ 網路錯誤"); }
    }

    async function unlockRecord() {
        if (!currentTxId) return;
        try {
            await fetch(GAS_API_URL, { method: 'POST', body: JSON.stringify({ action: 'updateStatus', txId: currentTxId, lockedBy: '', status: '', token: sessionToken }) });
            currentRecord.lockedBy = '';
            currentRecord.status = '';
            document.getElementById('status-select').value = '';
            document.getElementById('btn-unlock').style.display = 'none';
            renderList(currentListType);
            showToast("🔓 已強制解除鎖定與狀態");
        } catch (err) { showToast("❌ 解鎖失敗"); }
    }

    async function loadCanvasImage(stationId, type) {
        const imgElement = document.getElementById('reportImage');
        const loadingMsg = document.getElementById('image-loading');
        
        imgElement.style.display = 'none';
        loadingMsg.classList.remove('hidden');
        resetZoom();

        try {
            const res = await fetch(`${GAS_API_URL}?action=getImage&stationId=${stationId}&type=${type}&token=${sessionToken}`);
            const json = await res.json();
            
            if (json.status === 'success') {
                imgElement.src = json.data;
                imgElement.onload = () => {
                    loadingMsg.classList.add('hidden');
                    imgElement.style.display = 'block';
                };
            } else {
                loadingMsg.textContent = '❌ 找不到圖檔';
            }
        } catch (err) {
            loadingMsg.textContent = '❌ 載入圖檔失敗';
        }
    }

    function zoomImage(delta) {
        imageScale = Math.max(0.2, Math.min(imageScale + delta, 3.0));
        document.getElementById('reportImage').style.transform = `scale(${imageScale})`;
    }

    function resetZoom() {
        imageScale = 1.0;
        document.getElementById('reportImage').style.transform = `scale(1)`;
    }

    function printImage() {
        const imgSrc = document.getElementById('reportImage').src;
        if (!imgSrc) return showToast("⚠️ 沒有可列印的圖檔");
        
        const printWindow = window.open('', '_blank');
        printWindow.document.write(`
            <html><head><title>列印圖檔</title></head>
            <body style="margin:0;display:flex;justify-content:center;align-items:center;">
                <img src="${imgSrc}" style="max-width:100%;height:auto;">
            </body>
            <script>window.onload=function(){window.print();window.close();}<\/script>
            </html>
        `);
        printWindow.document.close();
    }
</script>
</body>
</html>
