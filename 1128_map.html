<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>選務計票動態指揮圖台</title>
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Leaflet 地圖套件 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: "Microsoft JhengHei", sans-serif; overflow: hidden; background-color: #f8fafc;}
        #map { width: 100vw; height: 100vh; z-index: 1; --marker-scale: 1; }

        /* 頂部控制面板 */
/* ... existing code ... -->
        /* 💡 專屬客製化：剖半水滴 Marker (Leaflet DivIcon) */
        .custom-pin-container {
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            width: 60px;
            /* 💡 以水滴箭頭尖端 (30px, 40px) 為縮放中心，確保放大時緊貼座標與放射線端點不偏移 */
            transform-origin: 30px 40px;
            transform: scale(var(--marker-scale, 1));
            transition: transform 0.2s ease-out;
            will-change: transform;
        }

        /* 💡 滑鼠移到標記上時自動浮到最上層，避免相鄰票所互相遮擋 */
        .leaflet-marker-icon:hover {
            z-index: 9999 !important;
        }
        
        .pin-circle {
/* ... existing code ... -->
            <!-- 💡 新增：圖層切換選單 -->
            <div class="mt-1 border-t border-slate-200 pt-2">
                <div class="text-xs font-bold text-slate-500 mb-1">切換地圖圖層：</div>
                <div class="flex gap-3 text-sm font-bold text-slate-700">
                    <label class="cursor-pointer flex items-center gap-1 hover:text-blue-600"><input type="radio" name="mapLayer" value="light" checked> 淺色簡約</label>
                    <label class="cursor-pointer flex items-center gap-1 hover:text-blue-600"><input type="radio" name="mapLayer" value="terrain"> 等高地形</label>
                    <label class="cursor-pointer flex items-center gap-1 hover:text-blue-600"><input type="radio" name="mapLayer" value="osm"> 標準街道</label>
                </div>
            </div>

            <!-- 💡 新增：標記隨地圖自動縮放控制 -->
            <div class="mt-1 border-t border-slate-200 pt-2 flex items-center justify-between text-xs font-bold text-slate-700">
                <label class="cursor-pointer flex items-center gap-1.5 hover:text-blue-600 select-none">
                    <input type="checkbox" id="auto-scale-toggle" checked class="w-4 h-4 accent-blue-600">
                    標記隨地圖自動放大
                </label>
                <span id="scale-badge" class="bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded font-mono">1.0x</span>
            </div>
        </div>

        <div class="panel-box">
            <h3 class="font-bold text-slate-700 text-sm mb-2 border-b pb-1">圖例說明 (左:公職 / 右:公投)</h3>
            <div class="flex flex-col gap-2 text-sm font-bold text-slate-600">
                <div class="flex items-center gap-2"><div class="w-4 h-4 rounded c-gray"></div> 尚未判定 / 空白</div>
                <div class="flex items-center gap-2"><div class="w-4 h-4 rounded c-red"></div> 數字有誤 (紅)</div>
                <div class="flex items-center gap-2"><div class="w-4 h-4 rounded c-yellow"></div> 待補正 (黃)</div>
                <div class="flex items-center gap-2"><div class="w-4 h-4 rounded c-green1"></div> 一聯報表ok (綠)</div>
                <div class="flex items-center gap-2"><div class="w-4 h-4 rounded c-green2"></div> 一二聯報表ok (深綠)</div>
            </div>
        </div>
    </div>

    <!-- 地圖容器 -->
    <div id="map"></div>

    <script>
        // ⚠️ 記得替換為您專屬的 GAS 網址 (與試算表同一個 API)
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbw7-9Axst2b44keFWFllxzuLWGJPuWoVOijT1-C79K-6AkqPqEwQ6iL02zzjqlalNwhuA/exec'; 

        // 初始化 Leaflet 地圖 (預設中心點設為萬華區)
        const map = L.map('map').setView([25.033, 121.499], 14);

        // 💡 定義 3 種簡單、低干擾的圖層 (已全部解鎖放大極限至 20 級)
        const mapLayers = {
            // 1. 淺色簡約圖 (Esri Gray) - 原生只到16，利用 maxNativeZoom 硬體拉伸至20
            light: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
                maxNativeZoom: 16, maxZoom: 20, attribution: 'Esri'
            }),
            // 2. 等高線地形圖 (Esri Topo) - 原生到19，拉伸至20
            terrain: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
                maxNativeZoom: 19, maxZoom: 20, attribution: 'Esri'
            }),
            // 3. 標準街道圖 (OSM) - 原生到19，拉伸至20
            osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxNativeZoom: 19, maxZoom: 20, attribution: 'OSM'
            })
        };

        // 預設載入「淺色簡約圖」
        let currentLayer = mapLayers.light;
        currentLayer.addTo(map);

        // 監聽單選按鈕切換圖層
        document.querySelectorAll('input[name="mapLayer"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                map.removeLayer(currentLayer);
                currentLayer = mapLayers[e.target.value];
                currentLayer.addTo(map);
            });
        });

        // 建立一個群組，用來統整所有的 Marker (方便後續清除或自動縮放)
        let markersGroup = L.featureGroup().addTo(map);
        let isFirstLoad = true; // 💡 僅首次載入時自動縮放全區，避免 60 秒刷新時打斷目前放大檢視的街道視角

        // 💡 依據地圖 Zoom 層級動態調整 Marker 縮放倍率
        function updateMarkerScale() {
            const mapEl = document.getElementById('map');
            const autoScaleToggle = document.getElementById('auto-scale-toggle');
            const scaleBadge = document.getElementById('scale-badge');

            let scale = 1;
            if (autoScaleToggle && autoScaleToggle.checked) {
                const zoom = map.getZoom();
                // Zoom 14 為基準 1.0x；每放大一級增加 0.22 倍，上限 2.35x、下限 0.75x
                scale = Math.max(0.75, Math.min(2.35, 1 + (zoom - 14) * 0.22));
            }

            mapEl.style.setProperty('--marker-scale', scale.toFixed(2));
            if (scaleBadge) {
                scaleBadge.textContent = `${scale.toFixed(1)}x`;
            }
        }

        // 監聽地圖縮放事件與自動放大開關
        map.on('zoomend', updateMarkerScale);
        document.getElementById('auto-scale-toggle').addEventListener('change', updateMarkerScale);
        updateMarkerScale();

        // 狀態文字對應顏色解析
// ... existing code ... -->
                    // 僅於首次載入時自動將地圖縮放至包含所有地標的最佳視野
                    if (isFirstLoad && json.data.length > 0) {
                        map.fitBounds(markersGroup.getBounds(), { padding: [50, 50] });
                        isFirstLoad = false;
                    }

                    // 更新時間顯示
// ... existing code ... -->
            const customIcon = L.divIcon({
                html: iconHtml,
                className: 'dummy-class', 
                iconSize: [60, 66],
                iconAnchor: [30, 40],  // 💡 精準對齊水滴箭頭尖端，配合 transform-origin 放大不偏移
                popupAnchor: [0, -38]  // 💡 讓點擊彈窗從水滴上方優雅展開
            });

            const popupHtml = `
                <div class="popup-header">📍 票所 ${station.id}</div>
                <div class="popup-body">
                    <div class="popup-row">
                        <span>公職報表：</span>
                        <span class="status-badge" style="background-color: ${govColor}">${station.govStatus || '尚未判定'}</span>
                    </div>
                    <div class="popup-row">
                        <span>公投報表：</span>
                        <span class="status-badge" style="background-color: ${refColor}">${station.refStatus || '尚未判定'}</span>
                    </div>
                </div>
            `;

            L.marker([lat, lng], { icon: customIcon })
                .bindPopup(popupHtml)
                .addTo(markersGroup);
        }

        // 初次載入
        fetchMapData();

        // 設定每 60 秒自動刷新一次
        setInterval(fetchMapData, 60000);

    </script>
</body>
</html>
